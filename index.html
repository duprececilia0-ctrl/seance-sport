<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e23b2a">
<title>Mes séances</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: direct et énergique, comme un carnet qu'on garde dans son sac de sport
   IDEA: le carnet de salle et le disque de fonte numéroté
   PICTURE: la séance en cours elle-même, une carte par exercice, une ligne par série
   COLOUR and TYPE: fond craie, encre noire, rouge disque #e23b2a ; Barlow Condensed + Barlow
   LAYOUT: une colonne pour le pouce, barre d'onglets en bas, bouton Enregistrer collant */
:root{color-scheme:light dark;
--bg:light-dark(#f4f2ee,#111113);--card:light-dark(#ffffff,#1c1c20);--ink:light-dark(#141414,#f2f0ec);
--mute:light-dark(#69655e,#a39f97);--line:light-dark(#e2ded5,#2f2f35);--acc:#e23b2a;--soft:light-dark(#fde7e3,#3a1814)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
h1{font:700 40px/1.05 'Barlow Condensed',sans-serif;margin:0;text-wrap:balance}
h2{font:700 24px/1.1 'Barlow Condensed',sans-serif;margin:24px 0 10px}
.status{font-size:13px;color:var(--mute);text-align:right;flex:none;max-width:45%}
button.status{border:0;background:none;padding:6px 0;min-height:36px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:14px;padding:12px 14px;margin:0 0 16px;font-size:14.5px}
.banner p{margin:0;flex:1 1 180px}
.acc{display:grid;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.acc p{margin:0}
.acc .save{min-height:52px;font-size:21px;box-shadow:none}
.acc .row{display:flex;gap:8px;flex-wrap:wrap}
.acc .row>*{flex:1 1 140px}
.msg{font-size:14px;color:var(--mute)}
.msg.err{color:var(--acc)}
.link{border:0;background:none;color:var(--acc);font-weight:600;padding:8px 0;justify-self:start}
.lbl{display:block;font-size:13px;color:var(--mute);margin:0 0 6px;font-weight:500}
input,select,textarea{font:inherit;font-size:16px;width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:0 12px}
textarea{padding:10px 12px;line-height:1.4;resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:none}
.row2{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 15px;border-radius:999px;border:1.5px solid var(--c,var(--line));background:transparent;font-weight:600;font-size:15px}
.chip.on{background:var(--c,var(--ink));color:#fff;border-color:var(--c,var(--ink))}
.chip.all.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ex{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-top:12px;box-shadow:0 1px 0 var(--line)}
.exhead{display:flex;gap:10px;align-items:center}
.disc{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 19px/1 'Barlow Condensed',sans-serif;box-shadow:inset 0 0 0 3px var(--ink),inset 0 0 0 5px var(--bg)}
.name{font-weight:600;border-color:transparent;background:var(--bg)}
.x{flex:none;width:44px;height:44px;border:0;background:none;color:var(--mute);font-size:28px;line-height:1;border-radius:12px}
.sets{display:grid;gap:6px;margin-top:10px}
.setrow{display:grid;grid-template-columns:58px minmax(0,1fr) minmax(0,1fr) 40px;gap:8px;align-items:center}
.sethead{font-size:12.5px;color:var(--mute);font-weight:500;text-align:center}
.sethead span:first-child{text-align:left}
.setn{font:700 17px/1 'Barlow Condensed',sans-serif;color:var(--mute)}
.setrow input{text-align:center;font:700 24px/1 'Barlow Condensed',sans-serif;min-height:50px;padding:0 4px}
.rmset{width:40px;height:44px;border:0;background:none;color:var(--mute);font-size:22px;border-radius:10px}
.extools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mini{min-height:40px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:none;font-weight:600;font-size:14px}
.mini.red{background:var(--soft);border-color:transparent;color:var(--acc)}
.exnote{margin-top:10px;min-height:60px;font-size:15px}
.last{font-size:13.5px;color:var(--mute);margin-top:10px;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.last:empty{display:none}
.last b{color:var(--ink);font-weight:600}
.reuse{border:0;background:var(--soft);color:var(--acc);font-weight:600;font-size:13.5px;border-radius:10px;padding:0 12px;min-height:34px;margin-left:auto}
.add{width:100%;min-height:54px;border:2px dashed var(--line);background:none;border-radius:16px;font-weight:600;margin-top:12px}
.snote{margin-top:18px}
.actions{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom));padding-top:14px;display:flex;gap:8px;background:linear-gradient(transparent,var(--bg) 30%)}
.save{flex:1;min-height:56px;background:var(--acc);color:#fff;border:0;border-radius:16px;font:700 23px/1 'Barlow Condensed',sans-serif;box-shadow:0 10px 22px -10px rgba(226,59,42,.7)}
.save:disabled{opacity:.6}
.ghost{min-height:56px;padding:0 16px;border:1.5px solid var(--line);background:var(--card);border-radius:16px;font-weight:600}
.s{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
.shead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sdate{font:700 21px/1.1 'Barlow Condensed',sans-serif;text-transform:capitalize}
.pill{background:var(--c);color:#fff;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600}
.lines{list-style:none;margin:10px 0 0;padding:0}
.lines li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.lines .v{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600;text-align:right;flex:none}
.lines .v span{display:block}
.lines small{display:block;color:var(--mute);font-size:13.5px;line-height:1.35;margin-top:2px;white-space:pre-line}
.snotes{margin:10px 0 0;padding:10px 12px;background:var(--bg);border-radius:12px;font-size:14.5px;line-height:1.4;white-space:pre-line}
.sbtn{display:flex;gap:8px;margin-top:10px}
.sbtn button{min-height:40px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:none;font-weight:600;font-size:14px}
.sbtn .rm.arm{background:var(--acc);border-color:var(--acc);color:#fff}
.empty{text-align:center;color:var(--mute);padding:40px 16px;border:2px dashed var(--line);border-radius:18px;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat small{display:block;font-size:12.5px;color:var(--mute)}
.stat b{font:700 clamp(24px,7vw,32px)/1.1 'Barlow Condensed',sans-serif;white-space:nowrap}
.stat.hi b{color:var(--acc)}
.fig{position:relative;height:240px;background:var(--card);border:1px solid var(--line);border-radius:18px;margin-top:12px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.copyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.copyrow p{margin:0;font-size:13px;color:var(--mute);flex:1 1 180px}
#tsv{height:140px;margin-top:10px;font:13px/1.4 ui-monospace,monospace}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
nav.tabs button{flex:1;max-width:190px;min-height:66px;border:0;background:none;color:var(--mute);font-weight:600;font-size:13px;display:grid;place-items:center;align-content:center;gap:3px}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--acc)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">

<section id="tab-seance">
  <div class="top">
    <h1 id="formTitle">Nouvelle séance</h1>
    <button type="button" class="status" id="status">Enregistré sur cet appareil</button>
  </div>
  <div class="banner" id="loginBanner" hidden><p>Connecte-toi pour sauvegarder tes séances en ligne.</p><button type="button" class="mini red" id="bannerBtn">Se connecter</button></div>
  <div class="row2">
    <div><label class="lbl" for="date">Date</label><input type="date" id="date"></div>
    <div><span class="lbl">Thème de la séance</span><div class="chips" id="themes"></div></div>
  </div>
  <div id="exs"></div>
  <button type="button" class="add" id="addEx">+ Ajouter un exercice</button>
  <div class="snote"><label class="lbl" for="snote">Notes de la séance</label>
    <textarea id="snote" placeholder="Forme du jour, sensations, ce qu'il faut changer la prochaine fois…"></textarea></div>
  <div class="actions">
    <button type="button" class="ghost" id="cancelEdit" hidden>Annuler</button>
    <button type="button" class="save" id="save">Enregistrer la séance</button>
  </div>
</section>

<section id="tab-hist" hidden>
  <div class="top"><h1>Historique</h1><div class="status" id="histCount"></div></div>
  <div class="chips" id="hfilter"></div>
  <div id="hist"></div>
  <div class="copyrow">
    <p>Copie toutes tes séances pour les coller dans ton tableau de suivi.</p>
    <button type="button" class="ghost" id="copy">Copier pour le tableau</button>
  </div>
  <textarea id="tsv" hidden readonly aria-label="Séances à copier"></textarea>
</section>

<section id="tab-compte" hidden>
  <div class="top"><h1>Mon compte</h1><button type="button" class="mini" id="backBtn">Retour</button></div>
  <div class="acc" id="accBox"></div>
</section>

<section id="tab-prog" hidden>
  <div class="top"><h1>Progrès</h1></div>
  <label class="lbl" for="exSel">Exercice ou machine</label>
  <select id="exSel"></select>
  <div id="progBody"></div>
</section>

</div>

<nav class="tabs" aria-label="Sections">
  <button type="button" data-tab="seance" class="on"><svg viewBox="0 0 24 24"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/></svg>Séance</button>
  <button type="button" data-tab="hist"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Historique</button>
  <button type="button" data-tab="prog"><svg viewBox="0 0 24 24"><path d="M4 19h16M5 15l4-4 3 3 7-7M15 7h4v4"/></svg>Progrès</button>
</nav>
<datalist id="names"></datalist>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
{
/* Supabase : colle ici l'URL du projet et la clé « publishable » (ou « anon public »). Jamais la clé secrète. */
const SUPABASE_URL="https://ufxyzlyeilrzixryaxaw.supabase.co";
const SUPABASE_KEY="sb_publishable_NdaokTR33zjKUUXS2UQN3w_RGobPSq7";

const THEMES=[["Jambes","#d4690c"],["Fesses","#c2367f"],["Dos","#13867f"],["Haut du corps","#2f6fd6"]];
const colOf=t=>(THEMES.find(x=>x[0]===t)||[0,"#7a766f"])[1];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);
const pad2=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())};
const fmtD=d=>{const x=new Date(d+"T12:00");return isNaN(x)?d:x.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"})};
const shortD=d=>{const x=new Date(d+"T12:00");return isNaN(x)?d:x.toLocaleDateString("fr-FR",{day:"numeric",month:"short"})};
const num=v=>{if(v==null||v==="")return null;const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:null};
const fr=n=>n==null?"–":String(Math.round(n*100)/100).replace(".",",");
const str=n=>n==null?"":String(n).replace(".",",");
const key=n=>String(n||"").trim().toLowerCase();
const newId=()=>"s"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* Une série = {r: répétitions, p: poids}. Les anciennes séances (séries × reps × poids) sont converties. */
const setsOf=e=>{
  if(Array.isArray(e?.sets))return e.sets.map(x=>({r:num(x?.r),p:num(x?.p)}));
  const n=Math.min(20,Math.max(1,Math.round(num(e?.s)||1)));
  return Array.from({length:n},()=>({r:num(e?.r),p:num(e?.p)}));
};
const clean=(o,id)=>({id:String(id),date:String(o?.date||""),theme:String(o?.theme||""),note:String(o?.note||""),t:Number(o?.t)||0,
  ex:Array.isArray(o?.ex)?o.ex.map(e=>({n:String(e?.n||""),note:String(e?.note||""),sets:setsOf(e)})):[]});
/* Regroupe les séries identiques qui se suivent : 3 × 10 · 40 kg */
const groups=sets=>{const g=[];for(const s of sets){const l=g[g.length-1];if(l&&l.r===s.r&&l.p===s.p)l.c++;else g.push({c:1,r:s.r,p:s.p})}return g};
const gTxt=g=>`${fr(g.c)} × ${fr(g.r)} · ${fr(g.p)} kg`;
const maxP=sets=>{const ps=sets.map(s=>s.p).filter(p=>p!=null);return ps.length?Math.max(...ps):null};

const emptySet=()=>({r:"",p:""});
const emptyEx=()=>({n:"",note:"",showNote:false,sets:[emptySet()]});
const blank=()=>({id:null,date:today(),theme:"",note:"",ex:[emptyEx()]});
const toDraftEx=e=>({n:e.n,note:e.note||"",showNote:!!e.note,sets:(e.sets.length?e.sets:[{r:null,p:null}]).map(s=>({r:str(s.r),p:str(s.p)}))});
function normDraft(d){
  if(!d||!Array.isArray(d.ex))return blank();
  return{id:d.id||null,date:d.date||today(),theme:String(d.theme||""),note:String(d.note||""),
    ex:d.ex.map(e=>Array.isArray(e?.sets)?{n:String(e.n||""),note:String(e.note||""),showNote:!!(e.showNote||e.note),sets:e.sets.length?e.sets.map(s=>({r:String(s?.r??""),p:String(s?.p??"")})):[emptySet()]}:toDraftEx(clean({ex:[e]},0).ex[0]))};
}

let sessions=LS.get("seances",[]).map(o=>clean(o,o.id));
let mode="local",dbcol=null;
/* Supabase */
const SB_ON=!!(SUPABASE_URL&&SUPABASE_KEY);
let sb=null,sbUser=null,syncing=false,again=false,lastSync=null,accMsg="",accErr=false,recovery=false,accKey="";
let pending=LS.get("pending",{});if(!pending||typeof pending!=="object"||Array.isArray(pending))pending={};
let draft=normDraft(LS.get("brouillon",null));
let hf="Tous",progEx=LS.get("progEx",""),pendingRm=null,rmTimer=0,chartPts=[];

const sorted=()=>[...sessions].sort((a,b)=>b.date.localeCompare(a.date)||b.t-a.t);
const saveDraft=()=>LS.set("brouillon",draft);

let tt=0;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2200)}
const hhmm=d=>d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
function setStatus(m){
  const n=Object.keys(pending).length;
  $("#status").textContent=m||(mode==="cloud"?"Synchronisé sur ton compte"
    :mode==="sb"?(n?"En attente d'envoi…":lastSync?"Sauvegardé · "+hhmm(lastSync):"Connectée")
    :SB_ON?"Non connectée":"Enregistré sur cet appareil");
  $("#loginBanner").hidden=!(SB_ON&&sb&&!sbUser&&mode!=="cloud");
  renderAcc();
}

function lastFor(name){
  const k=key(name);if(!k)return null;
  for(const s of sorted()){if(s.id===draft.id)continue;const e=s.ex.find(x=>key(x.n)===k);if(e)return{...e,date:s.date}}
  return null;
}
function lastHtml(i){
  const l=lastFor(draft.ex[i]?.n);if(!l)return"";
  return `Dernière fois (${esc(shortD(l.date))}) : <b>${groups(l.sets).map(g=>esc(gTxt(g))).join(" + ")}</b><button type="button" class="reuse" data-reuse="${i}">Reprendre</button>`;
}
function updateLast(i){const el=document.querySelector(`.ex[data-i="${i}"] .last`);if(el)el.innerHTML=lastHtml(i)}

function exHtml(e,i){
  return `<div class="ex" data-i="${i}">
    <div class="exhead"><span class="disc">${i+1}</span>
      <input class="name" list="names" placeholder="Exercice ou machine" value="${esc(e.n)}" data-f="n" autocomplete="off" aria-label="Exercice ou machine ${i+1}">
      <button type="button" class="x" data-del="${i}" aria-label="Retirer cet exercice">×</button></div>
    <div class="sets">
      <div class="setrow sethead"><span></span><span>Répétitions</span><span>Poids (kg)</span><span></span></div>
      ${e.sets.map((s,k)=>`<div class="setrow">
        <span class="setn">Série ${k+1}</span>
        <input inputmode="numeric" data-f="r" data-k="${k}" value="${esc(s.r)}" placeholder="0" aria-label="Répétitions série ${k+1}">
        <input inputmode="decimal" data-f="p" data-k="${k}" value="${esc(s.p)}" placeholder="0" aria-label="Poids série ${k+1}">
        ${e.sets.length>1?`<button type="button" class="rmset" data-rmset="${k}" aria-label="Retirer la série ${k+1}">×</button>`:"<span></span>"}
      </div>`).join("")}
    </div>
    <div class="extools">
      <button type="button" class="mini red" data-addset="${i}">+ Série</button>
      ${e.showNote?"":`<button type="button" class="mini" data-shownote="${i}">+ Note</button>`}
    </div>
    ${e.showNote?`<textarea class="exnote" data-f="note" placeholder="Réglage de la machine, sensations…" aria-label="Note de l'exercice ${i+1}">${esc(e.note)}</textarea>`:""}
    <div class="last">${lastHtml(i)}</div></div>`;
}
function renderForm(){
  $("#date").value=draft.date||today();
  $("#snote").value=draft.note||"";
  $("#formTitle").textContent=draft.id?"Modifier la séance":"Nouvelle séance";
  $("#cancelEdit").hidden=!draft.id;
  $("#save").textContent=draft.id?"Enregistrer les changements":"Enregistrer la séance";
  $("#themes").innerHTML=THEMES.map(([t,c])=>`<button type="button" class="chip${draft.theme===t?" on":""}" style="--c:${c}" data-t="${esc(t)}" aria-pressed="${draft.theme===t}">${esc(t)}</button>`).join("");
  $("#exs").innerHTML=draft.ex.map(exHtml).join("");
}

function renderNames(){
  const m=new Map();for(const s of sessions)for(const e of s.ex){const k=key(e.n);if(k&&!m.has(k))m.set(k,e.n.trim())}
  $("#names").innerHTML=[...m.values()].sort((a,b)=>a.localeCompare(b,"fr")).map(n=>`<option value="${esc(n)}">`).join("");
}

function renderHist(){
  $("#histCount").textContent=sessions.length?`${sessions.length} séance${sessions.length>1?"s":""}`:"";
  $("#hfilter").innerHTML=[["Tous",""],...THEMES].map(([t,c])=>`<button type="button" class="chip${t==="Tous"?" all":""}${hf===t?" on":""}" ${c?`style="--c:${c}"`:""} data-hf="${esc(t)}">${esc(t)}</button>`).join("");
  const list=sorted().filter(s=>hf==="Tous"||s.theme===hf);
  if(!list.length){$("#hist").innerHTML=`<div class="empty">${sessions.length?"Aucune séance avec ce thème.":"Pas encore de séance. Enregistre ta première dans l'onglet Séance."}</div>`;return}
  $("#hist").innerHTML=list.map(s=>`<article class="s">
    <div class="shead"><span class="sdate">${esc(fmtD(s.date))}</span>${s.theme?`<span class="pill" style="--c:${colOf(s.theme)}">${esc(s.theme)}</span>`:""}</div>
    <ul class="lines">${s.ex.map(e=>`<li><div>${esc(e.n)}${e.note?`<small>${esc(e.note)}</small>`:""}</div><div class="v">${groups(e.sets).map(g=>`<span>${esc(gTxt(g))}</span>`).join("")}</div></li>`).join("")}</ul>
    ${s.note?`<p class="snotes">${esc(s.note)}</p>`:""}
    <div class="sbtn"><button type="button" data-edit="${esc(s.id)}">Modifier</button><button type="button" class="rm${pendingRm===s.id?" arm":""}" data-rm="${esc(s.id)}">${pendingRm===s.id?"Confirmer la suppression":"Supprimer"}</button></div>
  </article>`).join("");
}

function progData(){
  const m=new Map();for(const s of sessions)for(const e of s.ex){const k=key(e.n);if(!k)continue;const o=m.get(k)||{n:e.n.trim(),c:0};o.c++;m.set(k,o)}
  return[...m.entries()].sort((a,b)=>b[1].c-a[1].c||a[1].n.localeCompare(b[1].n,"fr"));
}
function renderProg(){
  const names=progData(),sel=$("#exSel");
  if(!names.length){sel.innerHTML="";sel.disabled=true;$("#progBody").innerHTML=`<div class="empty">Tes courbes de progression apparaîtront ici après quelques séances.</div>`;chartPts=[];return}
  sel.disabled=false;
  if(!names.some(([k])=>k===progEx))progEx=names[0][0];
  sel.innerHTML=names.map(([k,o])=>`<option value="${esc(k)}"${k===progEx?" selected":""}>${esc(o.n)} (${o.c})</option>`).join("");
  const rows=[];
  for(const s of sessions){const es=s.ex.filter(e=>key(e.n)===progEx);if(!es.length)continue;
    const sets=es.flatMap(e=>e.sets);rows.push({date:s.date,t:s.t,sets,p:maxP(sets)})}
  rows.sort((a,b)=>a.date.localeCompare(b.date)||a.t-b.t);
  chartPts=rows.filter(r=>r.p!=null);
  const ps=chartPts.map(r=>r.p),rec=ps.length?Math.max(...ps):null,lastP=ps.length?ps[ps.length-1]:null,diff=ps.length>1?lastP-ps[0]:null;
  $("#progBody").innerHTML=`<div class="stats">
    <div class="stat hi"><small>Record</small><b>${esc(fr(rec))} kg</b></div>
    <div class="stat"><small>Dernière fois</small><b>${esc(fr(lastP))} kg</b></div>
    <div class="stat"><small>Depuis le début</small><b>${diff==null?"–":(diff>0?"+":"")+esc(fr(diff))+" kg"}</b></div></div>
    <div class="fig" id="figBox"><svg id="chart" role="img" aria-label="Évolution du poids le plus lourd"></svg></div>
    <h2>Toutes les fois</h2>
    <ul class="lines">${[...rows].reverse().map(r=>`<li><div>${esc(fmtD(r.date))}</div><div class="v">${groups(r.sets).map(g=>`<span>${esc(gTxt(g))}</span>`).join("")}</div></li>`).join("")}</ul>`;
  chartRO.observe($("#figBox"));drawChart();
}
function drawChart(){
  const s=$("#chart");if(!s)return;const W=s.clientWidth,H=s.clientHeight,pts=chartPts;
  if(!W||!H)return;
  if(!pts.length){s.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="currentColor" opacity=".6" font-size="14">Aucun poids noté</text>`;return}
  const L=40,R=16,T=18,B=28;let mn=Math.min(...pts.map(p=>p.p)),mx=Math.max(...pts.map(p=>p.p));
  if(mx-mn<4){mn-=2;mx+=2}const span=mx-mn;mn=Math.max(0,mn-span*.12);mx+=span*.12;
  const x=i=>pts.length===1?(L+W-R)/2:L+i*(W-L-R)/(pts.length-1),y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  let g="";for(let k=0;k<4;k++){const v=mn+(mx-mn)*k/3,yy=y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="currentColor" opacity=".12"/><text x="${L-8}" y="${yy+4}" text-anchor="end" font-size="12" fill="currentColor" opacity=".6">${esc(fr(Math.round(v)))}</text>`}
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(i)},${y(p.p)}`).join(""),base=H-B;
  const area=pts.length>1?`<path d="${line}L${x(pts.length-1)},${base}L${x(0)},${base}Z" fill="#e23b2a" opacity=".12"/>`:"";
  const recI=pts.reduce((bi,p,i)=>p.p>=pts[bi].p?i:bi,0);
  const dots=pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.p)}" r="${i===recI?6:4}" fill="${i===recI?"#e23b2a":"var(--card)"}" stroke="#e23b2a" stroke-width="2.5"/>`).join("");
  const lab=`<text x="${x(0)}" y="${H-8}" font-size="12" fill="currentColor" opacity=".6" text-anchor="${pts.length===1?"middle":"start"}">${esc(shortD(pts[0].date))}</text>`+(pts.length>1?`<text x="${x(pts.length-1)}" y="${H-8}" font-size="12" fill="currentColor" opacity=".6" text-anchor="end">${esc(shortD(pts[pts.length-1].date))}</text>`:"");
  s.innerHTML=g+area+`<path d="${line}" fill="none" stroke="#e23b2a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`+dots+lab;
}
const chartRO=new ResizeObserver(drawChart);

function renderAll(){renderNames();renderHist();renderProg();draft.ex.forEach((_,i)=>updateLast(i))}

const body=s=>({date:s.date,theme:s.theme,note:s.note,t:s.t,ex:s.ex});
async function persist(s){
  if(mode==="cloud"){await dbcol.doc(s.id).set(body(s));return}
  const i=sessions.findIndex(x=>x.id===s.id);if(i>=0)sessions[i]=s;else sessions.push(s);
  LS.set("seances",sessions);renderAll();
  if(mode==="sb"){pending[s.id]="up";LS.set("pending",pending);setStatus();sync()}
}
async function removeS(id){
  if(mode==="cloud"){await dbcol.doc(id).delete();return}
  sessions=sessions.filter(x=>x.id!==id);LS.set("seances",sessions);renderAll();
  if(mode==="sb"){pending[id]="del";LS.set("pending",pending);setStatus();sync()}
}

/* Sauvegarde en ligne (Supabase) : tout est d'abord enregistré sur le téléphone,
   puis envoyé dès qu'il y a du réseau. Pratique à la salle quand ça capte mal. */
async function sync(){
  if(mode!=="sb"||!sb||!sbUser)return;
  if(syncing){again=true;return}
  syncing=true;setStatus("Synchronisation…");
  try{
    for(const[id,op]of Object.entries(pending)){
      if(op==="del"){const{error}=await sb.from("seances").delete().eq("id",id);if(error)throw error}
      else{const s=sessions.find(x=>x.id===id);if(s){const{error}=await sb.from("seances").upsert({id:s.id,...body(s)});if(error)throw error}}
      delete pending[id];LS.set("pending",pending);
    }
    const{data,error}=await sb.from("seances").select("id,date,theme,note,ex,t").order("date",{ascending:false}).limit(1000);
    if(error)throw error;
    const server=(data||[]).map(r=>clean(r,r.id)),ids=new Set(server.map(x=>x.id));
    const waiting=sessions.filter(x=>pending[x.id]==="up"&&!ids.has(x.id));
    sessions=server.filter(x=>pending[x.id]!=="del").concat(waiting);
    LS.set("seances",sessions);lastSync=new Date();renderAll();setStatus();
  }catch(e){setStatus(navigator.onLine===false?"Hors ligne · envoi plus tard":"Synchro impossible · nouvel essai plus tard")}
  finally{syncing=false;renderAcc();if(again){again=false;sync()}}
}
function startSb(){
  if(!SB_ON||!window.supabase||typeof window.supabase.createClient!=="function")return;
  try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}catch(e){sb=null;return}
  sb.auth.onAuthStateChange((evt,session)=>{
    if(evt==="PASSWORD_RECOVERY"){recovery=true;showTab("compte")}
    const u=session?session.user:null;
    setTimeout(()=>setUser(u),0); /* jamais d'appel Supabase directement dans ce rappel */
  });
}
function setUser(u){
  const was=sbUser?sbUser.id:null;sbUser=u;
  if(u&&u.id!==was){
    const owner=LS.get("sbOwner",null);
    if(owner&&owner!==u.id){sessions=[];pending={}}
    else if(!owner){for(const x of sessions)if(!pending[x.id])pending[x.id]="up"}
    LS.set("sbOwner",u.id);LS.set("pending",pending);LS.set("seances",sessions);
    mode="sb";renderAll();sync();
  }
  if(!u&&mode==="sb")mode="local";
  setStatus();
}
async function logout(){
  if(Object.keys(pending).length){await sync();
    if(Object.keys(pending).length){accMsg="Certaines séances ne sont pas encore envoyées. Retrouve du réseau puis réessaie, sinon elles seraient perdues.";accErr=true;renderAcc();return}}
  await sb.auth.signOut();
  sessions=[];pending={};LS.set("seances",[]);LS.set("pending",{});LS.set("sbOwner",null);
  sbUser=null;mode="local";lastSync=null;accMsg="";renderAll();setStatus();
}
function frErr(e){
  const m=String(e&&e.message||"");
  if(/invalid login/i.test(m))return"E-mail ou mot de passe incorrect.";
  if(/not confirmed/i.test(m))return"Confirme d'abord ton e-mail (regarde dans tes mails, et les spams).";
  if(/already registered|already exists/i.test(m))return"Ce compte existe déjà : connecte-toi.";
  if(/password/i.test(m)&&/(short|least|characters)/i.test(m))return"Mot de passe trop court.";
  if(/rate limit|too many/i.test(m))return"Trop d'essais, attends quelques minutes.";
  if(/fetch|network/i.test(m))return"Pas de connexion internet.";
  return"Erreur : "+m;
}
function renderAcc(){
  const b=$("#accBox");if(!b)return;
  const n=Object.keys(pending).length;
  const state=mode==="cloud"?"cloud":!SB_ON?"nosb":!sb?"nolib":recovery&&sbUser?"pw":sbUser?"in":"out";
  const key=[state,accMsg,accErr,state==="in"?[sbUser.email,sessions.length,n,lastSync&&lastSync.getTime(),syncing]:""].join("|");
  if(key===accKey)return;accKey=key;
  const msg=accMsg?`<p class="msg${accErr?" err":""}" role="status">${esc(accMsg)}</p>`:"";
  if(state==="cloud"){b.innerHTML=`<p>Tes séances sont enregistrées sur ton compte Claude et synchronisées entre tes appareils.</p>`;return}
  if(state==="nosb"){b.innerHTML=`<p>Tes séances sont enregistrées sur cet appareil uniquement.</p><p class="msg">Pour les sauvegarder en ligne, il faut renseigner l'adresse et la clé du projet Supabase en haut du script.</p>`;return}
  if(state==="nolib"){b.innerHTML=`<p>Le service de sauvegarde n'a pas pu se charger. Vérifie ta connexion, puis ferme et rouvre l'appli.</p>`;return}
  if(state==="pw"){b.innerHTML=`<p>Choisis ton nouveau mot de passe.</p><div><label class="lbl" for="newPw">Nouveau mot de passe</label><input type="password" id="newPw" autocomplete="new-password"></div><button type="button" class="save" data-acc="setpw">Enregistrer le mot de passe</button>${msg}`;return}
  if(state==="in"){b.innerHTML=`<p>Connectée avec <b>${esc(sbUser.email||"")}</b></p>
    <p class="msg">${sessions.length} séance${sessions.length>1?"s":""} · ${syncing?"synchronisation…":n?n+" en attente d'envoi":lastSync?"tout est sauvegardé ("+esc(hhmm(lastSync))+")":"synchronisation…"}</p>
    <div class="row"><button type="button" class="save" data-acc="sync">Synchroniser</button><button type="button" class="ghost" data-acc="logout">Se déconnecter</button></div>${msg}`;return}
  b.innerHTML=`<p>Connecte-toi pour sauvegarder tes séances et les retrouver sur tous tes appareils.</p>
    <div><label class="lbl" for="em">E-mail</label><input type="email" id="em" autocomplete="email" inputmode="email" value="${esc(LS.get("email",""))}"></div>
    <div><label class="lbl" for="pw">Mot de passe</label><input type="password" id="pw" autocomplete="current-password"></div>
    <button type="button" class="save" data-acc="login">Se connecter</button>
    <div class="row"><button type="button" class="ghost" data-acc="signup">Créer un compte</button></div>
    <button type="button" class="link" data-acc="forgot">Mot de passe oublié ?</button>${msg}`;
}

function showTab(t){
  for(const n of["seance","hist","prog","compte"])$("#tab-"+n).hidden=n!==t;
  document.querySelectorAll("nav.tabs button").forEach(b=>{const on=b.dataset.tab===t;b.classList.toggle("on",on);on?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current")});
  if(t!=="compte")LS.set("onglet",t);window.scrollTo(0,0);if(t==="prog")drawChart();
}

/* Événements */
document.querySelector("nav.tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b)showTab(b.dataset.tab)});
$("#date").addEventListener("change",e=>{draft.date=e.target.value;saveDraft()});
$("#snote").addEventListener("input",e=>{draft.note=e.target.value;saveDraft()});
$("#themes").addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(!b)return;draft.theme=draft.theme===b.dataset.t?"":b.dataset.t;saveDraft();
  document.querySelectorAll("#themes .chip").forEach(c=>{const on=c.dataset.t===draft.theme;c.classList.toggle("on",on);c.setAttribute("aria-pressed",on)})});
$("#exs").addEventListener("input",e=>{
  const t=e.target,f=t.dataset.f;if(!f)return;const i=+t.closest(".ex").dataset.i,ex=draft.ex[i];
  if(f==="r"||f==="p")ex.sets[+t.dataset.k][f]=t.value;else ex[f]=t.value;
  saveDraft();if(f==="n")updateLast(i);
});
$("#exs").addEventListener("click",e=>{
  const card=e.target.closest(".ex");if(!card)return;const i=+card.dataset.i,ex=draft.ex[i];
  const d=e.target.closest("[data-del]");
  if(d){draft.ex.splice(i,1);if(!draft.ex.length)draft.ex.push(emptyEx());saveDraft();renderForm();return}
  const as=e.target.closest("[data-addset]");
  if(as){const l=ex.sets[ex.sets.length-1]||emptySet();ex.sets.push({r:l.r,p:l.p});saveDraft();renderForm();
    const ins=document.querySelectorAll(`.ex[data-i="${i}"] [data-f="p"]`);ins[ins.length-1]?.focus();return}
  const rs=e.target.closest("[data-rmset]");
  if(rs){ex.sets.splice(+rs.dataset.rmset,1);if(!ex.sets.length)ex.sets.push(emptySet());saveDraft();renderForm();return}
  const sn=e.target.closest("[data-shownote]");
  if(sn){ex.showNote=true;saveDraft();renderForm();document.querySelector(`.ex[data-i="${i}"] .exnote`)?.focus();return}
  const r=e.target.closest("[data-reuse]");
  if(r){const l=lastFor(ex.n);if(l){ex.sets=l.sets.map(s=>({r:str(s.r),p:str(s.p)}));if(!ex.sets.length)ex.sets.push(emptySet());saveDraft();renderForm()}}
});
$("#addEx").addEventListener("click",()=>{draft.ex.push(emptyEx());saveDraft();renderForm();const ins=document.querySelectorAll("#exs .name");ins[ins.length-1]?.focus()});
$("#cancelEdit").addEventListener("click",()=>{draft=blank();saveDraft();renderForm()});
$("#save").addEventListener("click",async()=>{
  const ex=draft.ex.filter(e=>String(e.n).trim()).map(e=>({n:String(e.n).trim(),note:String(e.note||"").trim(),
    sets:e.sets.map(s=>({r:num(s.r),p:num(s.p)})).filter(s=>s.r!=null||s.p!=null)}));
  if(!draft.theme){toast("Choisis le thème de la séance");return}
  if(!ex.length){toast("Ajoute au moins un exercice");return}
  const editing=!!draft.id,s={id:draft.id||newId(),date:draft.date||today(),theme:draft.theme,note:String(draft.note||"").trim(),t:Date.now(),ex};
  const btn=$("#save");btn.disabled=true;
  try{await persist(s);toast(editing?"Séance modifiée":"Séance enregistrée");draft=blank();saveDraft();renderForm();if(editing)showTab("hist")}
  catch(err){toast("Impossible d'enregistrer, réessaie")}
  finally{btn.disabled=false}
});
$("#hfilter").addEventListener("click",e=>{const b=e.target.closest("[data-hf]");if(b){hf=b.dataset.hf;renderHist()}});
$("#hist").addEventListener("click",async e=>{
  const ed=e.target.closest("[data-edit]");
  if(ed){const s=sessions.find(x=>x.id===ed.dataset.edit);if(!s)return;
    draft={id:s.id,date:s.date,theme:s.theme,note:s.note,ex:s.ex.map(toDraftEx)};
    if(!draft.ex.length)draft.ex.push(emptyEx());saveDraft();renderForm();showTab("seance");return}
  const rm=e.target.closest("[data-rm]");
  if(rm){const id=rm.dataset.rm;clearTimeout(rmTimer);
    if(pendingRm===id){pendingRm=null;try{await removeS(id);toast("Séance supprimée")}catch(err){toast("Suppression impossible, réessaie")}renderHist();return}
    pendingRm=id;renderHist();rmTimer=setTimeout(()=>{pendingRm=null;renderHist()},4000)}
});
$("#exSel").addEventListener("change",e=>{progEx=e.target.value;LS.set("progEx",progEx);renderProg()});
$("#copy").addEventListener("click",async()=>{
  if(!sessions.length){toast("Aucune séance à copier");return}
  const clip=t=>String(t||"").replace(/[\t\r\n]+/g," ").trim();
  const lines=[["Date","Thème","Exercice / Machine","Séries","Répétitions","Poids (kg)","Notes"].join("\t")];
  for(const s of[...sorted()].reverse()){
    const d=s.date.split("-").reverse().join("/");let first=true;
    for(const e of s.ex){let gi=0;for(const g of groups(e.sets)){
      const notes=[gi===0?clip(e.note):"",first&&s.note?"Séance : "+clip(s.note):""].filter(Boolean).join(" · ");
      lines.push([d,s.theme,clip(e.n),g.c,str(g.r),str(g.p),notes].join("\t"));gi++;first=false}}
    if(first&&s.note)lines.push([d,s.theme,"","","","","Séance : "+clip(s.note)].join("\t"));
  }
  const txt=lines.join("\n"),box=$("#tsv");
  try{await navigator.clipboard.writeText(txt);box.hidden=true;toast("Copié ! Colle-le dans ton tableau")}
  catch(err){box.value=txt;box.hidden=false;box.focus();box.select();toast("Sélectionne le texte et copie-le")}
});

$("#status").addEventListener("click",()=>showTab("compte"));
$("#bannerBtn").addEventListener("click",()=>showTab("compte"));
$("#backBtn").addEventListener("click",()=>showTab(LS.get("onglet","seance")));
window.addEventListener("online",()=>sync());
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")sync()});
$("#accBox").addEventListener("click",async e=>{
  const btn=e.target.closest("[data-acc]");if(!btn||!sb)return;const a=btn.dataset.acc;
  const em=($("#em")?.value||"").trim(),pw=$("#pw")?.value||"",here=location.origin+location.pathname;
  const say=(m,err)=>{accMsg=m;accErr=!!err;renderAcc()};
  btn.disabled=true;
  try{
    if(a==="login"){
      if(!em||!pw){say("Entre ton e-mail et ton mot de passe.",1);return}
      LS.set("email",em);const{error}=await sb.auth.signInWithPassword({email:em,password:pw});
      if(error){say(frErr(error),1);return}
      say("");showTab(LS.get("onglet","seance"));toast("Connectée");
    }else if(a==="signup"){
      if(!em||pw.length<6){say("Entre ton e-mail et un mot de passe d'au moins 6 caractères.",1);return}
      LS.set("email",em);const{data,error}=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:here}});
      if(error){say(frErr(error),1);return}
      say(data&&data.session?"Compte créé, tu es connectée.":"Compte créé ! Ouvre l'e-mail de confirmation, puis reviens te connecter ici.");
    }else if(a==="forgot"){
      if(!em){say("Entre d'abord ton e-mail.",1);return}
      LS.set("email",em);const{error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:here});
      if(error){say(frErr(error),1);return}
      say("E-mail envoyé : clique sur le lien pour choisir un nouveau mot de passe.");
    }else if(a==="setpw"){
      const np=$("#newPw")?.value||"";if(np.length<6){say("6 caractères minimum.",1);return}
      const{error}=await sb.auth.updateUser({password:np});if(error){say(frErr(error),1);return}
      recovery=false;say("Mot de passe changé.");
    }else if(a==="sync"){say("");await sync()}
    else if(a==="logout"){await logout()}
  }catch(err){say(frErr(err),1)}
  finally{if(btn.isConnected)btn.disabled=false}
});

/* Démarrage */
renderForm();renderAll();showTab(LS.get("onglet","seance"));
const onClaude=!!(window.claude&&typeof window.claude.use==="function");
if(!onClaude)startSb();
setStatus();

/* Synchronisation avec ton compte, si disponible */
(async()=>{
  const C=window.claude;if(!C||typeof C.use!=="function")return;
  try{
    const[db,user]=await Promise.all([C.use("db"),C.use("user")]);
    const uid=user?await user.id():null;
    if(!db||!uid)return;
    dbcol=db.collection("data/users/"+uid);
    let migrated=false;
    const timer=setTimeout(()=>setStatus("Connexion lente…"),10000);
    dbcol.onSnapshot(snap=>{
      if(!snap.metadata.fromCache)clearTimeout(timer);
      mode="cloud";
      sessions=snap.docs.map(d=>clean(d.data(),d.id));
      setStatus();renderAll();
      if(!migrated&&!snap.metadata.fromCache){migrated=true;migrate(new Set(sessions.map(s=>s.id)))}
    },err=>{clearTimeout(timer);mode="local";sessions=LS.get("seances",[]).map(o=>clean(o,o.id));setStatus("Synchro indisponible, enregistré sur cet appareil");renderAll()});
  }catch(e){}
})();
async function migrate(have){
  const local=LS.get("seances",[]).map(o=>clean(o,o.id));if(!local.length)return;
  try{for(const s of local)if(!have.has(s.id))await dbcol.doc(s.id).set(body(s));LS.set("seances",[])}catch(e){}
}
}
</script>
